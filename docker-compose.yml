services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: konstructor-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_GEMINI_API_KEY=${VITE_GEMINI_API_KEY:-}
    stdin_open: true
    tty: true
